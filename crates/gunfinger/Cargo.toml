[package]
name = "gunfinger"
description = "Identify tracks from a personal collection inside DJ mixes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gunfinger-core.workspace = true
clap = { version = "4", features = ["derive", "env"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
